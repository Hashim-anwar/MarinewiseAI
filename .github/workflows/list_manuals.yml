name: List OEM Manuals

on:
  workflow_dispatch:

jobs:
  list-manuals:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install gdown
        run: |
          python -m pip install --upgrade pip
          pip install "gdown>=6.1.0"

      - name: List MANUALS contents
        run: |
          python - <<'PY'
          import gdown

          folder_url = (
              "https://drive.google.com/drive/folders/"
              "1gI_rJpsDzJ3HsOBO0Hb50B71vaJDkXY5?usp=sharing"
          )

          print("=" * 60)
          print("MARINEWISE AI - MANUALS FOLDER LIST")
          print("=" * 60)

          files = gdown.download_folder(
              url=folder_url,
              quiet=False,
              use_cookies=False,
              skip_download=True,
          )

          print(f"\nTotal items detected: {len(files)}")

          print("\nFirst 30 items:")
          print("-" * 60)

          for number, item in enumerate(files[:30], start=1):
              print(
                  f"{number}. "
                  f"{item.path}"
              )

          print("\nNo files were downloaded.")
          print("MANUALS listing test: SUCCESS")
          PY
