      - name: Verify rebuilt training workflow
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("training_workflow.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR - training_workflow.json was not generated."
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          if data.get("step") != 30:
              raise SystemExit(
                  f"ERROR - Incorrect training workflow step: "
                  f"{data.get('step')}"
              )

          if data.get("status") != "READY_FOR_GROQ":
              raise SystemExit(
                  "ERROR - Training workflow is not READY_FOR_GROQ."
              )

          curriculum = data.get("curriculum", [])

          if not isinstance(curriculum, list):
              raise SystemExit(
                  "ERROR - Curriculum is not a list."
              )

          if len(curriculum) < 15:
              raise SystemExit(
                  "ERROR - Training curriculum is incomplete."
              )

          stage = data.get(
              "stage",
              "not specified"
          )

          print("=" * 70)
          print("STEP 30 WORKFLOW REBUILT SUCCESSFULLY")
          print("=" * 70)
          print(f"Step               : {data.get('step')}")
          print(f"Stage              : {stage}")
          print(f"Status             : {data.get('status')}")
          print(f"Curriculum sections: {len(curriculum)}")
          print()
          print("STEP 30 validation  : TRUE")
          print("GREEN")
          PY
