name: Test Google Drive Access

on:
  workflow_dispatch:

jobs:
  test-drive:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Google Drive tools
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      - name: Check MANUALS folder
        run: |
          python - <<'PY'
          import requests

          folder_id = "1gI_rJpsDzJ3HsOBO0Hb50B71vaJDkXY5"

          url = (
              "https://drive.google.com/drive/folders/"
              + folder_id
          )

          print("Checking Google Drive folder...")
          print(url)

          response = requests.get(
              url,
              timeout=30,
          )

          print(f"HTTP status: {response.status_code}")

          if response.status_code != 200:
              raise RuntimeError(
                  f"Google Drive returned HTTP {response.status_code}"
              )

          page = response.text

          if folder_id not in page:
              raise RuntimeError(
                  "Folder ID was not found in the Google Drive response."
              )

          print("Google Drive folder is publicly accessible.")
          print("Folder access test: SUCCESS")
          PY
