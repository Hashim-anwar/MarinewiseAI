name: Test Google Drive Access

on:
  workflow_dispatch:

jobs:
  test-drive:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install gdown
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      - name: Test MANUALS folder access
        run: |
          python - <<'PY'
          import gdown

          url = "https://drive.google.com/drive/folders/1gI_rJpsDzJ3HsOBO0Hb50B71vaJDkXY5?usp=sharing"

          print("Checking Google Drive folder...")
          print(url)

          try:
              files = gdown.download_folder(
                  url=url,
                  output="/tmp/marinewise_drive_test",
                  quiet=False,
                  use_cookies=False,
                  remaining_ok=True,
                  skip_download=True,
              )

              print("Google Drive folder access: SUCCESS")
              print(f"Items detected: {len(files) if files else 0}")

          except Exception as error:
              print("Google Drive folder access: FAILED")
              print(error)
              raise
          PY
