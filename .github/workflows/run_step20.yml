name: MarineWise STEP 20 - Selective Manual Download

on:
  workflow_dispatch:

jobs:
  download-selected-manuals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install downloader dependency
        run: |
          python -m pip install --upgrade pip
          pip install "gdown>=6.1.0"

      - name: Verify STEP 19 selection
        run: |
          echo "=========================================="
          echo "STEP 20 - VERIFY SELECTION"
          echo "=========================================="

          test -f selected_manuals.json
          echo "GREEN - selected_manuals.json found"

          python - <<'PY'
          import json

          with open("selected_manuals.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          results = data.get("results", [])

          print(f"Selected manuals: {len(results)}")

          assert len(results) == 10, (
              f"Expected 10 selected manuals, found {len(results)}"
          )

          for i, item in enumerate(results, 1):
              filename = item.get("file_name", "UNKNOWN")
              file_id = item.get("google_drive_file_id")

              print(f"{i}. {filename}")
              print(f"   Drive ID: {file_id}")

              assert file_id, f"Missing Google Drive ID for {filename}"

          print()
          print("GREEN - all 10 manuals have Google Drive IDs")
          PY

      - name: Run STEP 20 selective downloader
        run: |
          python manual_downloader.py

      - name: Verify downloaded manuals
        run: |
          echo "=========================================="
          echo "STEP 20 FINAL VERIFICATION"
          echo "=========================================="

          test -d selected_manuals
          echo "GREEN - selected_manuals directory exists"

          COUNT=$(find selected_manuals -maxdepth 1 -type f | wc -l)

          echo "Downloaded files: $COUNT"

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR - no manuals downloaded"
            exit 1
          fi

          if [ "$COUNT" -gt 10 ]; then
            echo "ERROR - more than 10 manuals downloaded"
            exit 1
          fi

          echo
          echo "Downloaded manuals:"
          find selected_manuals -maxdepth 1 -type f -printf " - %f\n"

          echo
          echo "=========================================="
          echo "STEP 20: SUCCESS"
          echo "GREEN"
          echo "=========================================="
