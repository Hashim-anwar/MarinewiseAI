name: MarineWise STEP 33A Assessment Workflow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assessment-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify required files
        shell: bash
        run: |
          set -e

          for file in \
            training_workflow.py \
            assessment_workflow.py \
            manual_catalog.json
          do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file not found: $file"
              exit 1
            fi
          done

          echo "Required files verified."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq gdown

      - name: Verify training workflow CLI
        run: |
          python training_workflow.py --help

      - name: Verify assessment workflow CLI
        run: |
          python assessment_workflow.py --help

      - name: Build STEP 30 training workflow
        run: |
          python training_workflow.py \
            --manufacturer "MAN" \
            --engine-model "16V175D-MM" \
            --topic "Fuel System and Injector Maintenance" \
            --technician-level "Basic" \
            --duration "4 Days" \
            --vessel "QL-40" \
            --manuals "manual_catalog.json" \
            --output training_workflow.json

      - name: Validate STEP 30 training workflow
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("training_workflow.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: training_workflow.json was not created."
              )

          if path.stat().st_size == 0:
              raise SystemExit(
                  "ERROR: training_workflow.json is empty."
              )

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: training_workflow.json must contain a JSON object."
              )

          if data.get("step") != 30:
              raise SystemExit(
                  f"ERROR: Expected STEP 30, got {data.get('step')}"
              )

          if data.get("status") != "READY_FOR_GROQ":
              raise SystemExit(
                  f"ERROR: Expected READY_FOR_GROQ, got {data.get('status')}"
              )

          if data.get("stage") != "training_intelligence_curriculum_planner":
              raise SystemExit(
                  "ERROR: Unexpected STEP 30 stage: "
                  + str(data.get("stage"))
              )

          print("STEP 30 training workflow validation: GREEN")
          print("Step:", data.get("step"))
          print("Stage:", data.get("stage"))
          print("Status:", data.get("status"))
          PY

      - name: Run STEP 33A assessment workflow
        run: |
          python assessment_workflow.py \
            --training training_workflow.json \
            --output assessment_workflow.json \
            --question-count 20 \
            --passing-score 70

      - name: Inspect STEP 33A JSON structure
        shell: bash
        run: |
          python - <<'PY'
          import json

          with open("assessment_workflow.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("")
          print("========== STEP 33A OUTPUT STRUCTURE ==========")
          print("Top-level keys:")
          for key in data.keys():
              print(" -", key)

          configuration = data.get("assessment_configuration")

          print("")
          print("assessment_configuration type:")
          print(type(configuration).__name__)

          if isinstance(configuration, dict):
              print("")
              print("assessment_configuration keys:")
              for key in configuration.keys():
                  print(" -", key)

          print("===============================================")
          PY

      - name: Validate STEP 33A output
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("assessment_workflow.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: assessment_workflow.json was not created."
              )

          if path.stat().st_size == 0:
              raise SystemExit(
                  "ERROR: assessment_workflow.json is empty."
              )

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: assessment_workflow.json must contain a JSON object."
              )

          # ---------------------------------------------------------
          # CORE STEP IDENTIFICATION
          # ---------------------------------------------------------

          if data.get("step") != 33:
              raise SystemExit(
                  f"ERROR: Expected step 33, got {data.get('step')}"
              )

          if data.get("substep") != "33A":
              raise SystemExit(
                  f"ERROR: Expected substep 33A, got {data.get('substep')}"
              )

          if data.get("stage") != "assessment_workflow":
              raise SystemExit(
                  f"ERROR: Expected stage assessment_workflow, "
                  f"got {data.get('stage')}"
              )

          if data.get("status") != "READY_FOR_GROQ":
              raise SystemExit(
                  f"ERROR: Expected status READY_FOR_GROQ, "
                  f"got {data.get('status')}"
              )

          # ---------------------------------------------------------
          # ASSESSMENT CONFIGURATION
          # ---------------------------------------------------------

          configuration = data.get("assessment_configuration")

          if not isinstance(configuration, dict):
              raise SystemExit(
                  "ERROR: assessment_configuration must be a JSON object."
              )

          # ---------------------------------------------------------
          # QUESTION COUNT
          # ---------------------------------------------------------

          question_count = configuration.get("question_count")

          if question_count != 20:
              raise SystemExit(
                  f"ERROR: Expected question_count 20, "
                  f"got {question_count}"
              )

          # ---------------------------------------------------------
          # PASSING SCORE
          # ---------------------------------------------------------

          passing_score = configuration.get("passing_score_percent")

          if passing_score != 70:
              raise SystemExit(
                  f"ERROR: Expected passing_score_percent 70, "
                  f"got {passing_score}"
              )

          # ---------------------------------------------------------
          # ASSESSMENT AREAS
          #
          # Accept list, dictionary, string, or other sized structure.
          # ---------------------------------------------------------

          areas = configuration.get("areas")

          if areas is None:
              raise SystemExit(
                  "ERROR: Assessment areas are missing."
              )

          if isinstance(areas, (list, dict)):
              area_count = len(areas)

          elif isinstance(areas, str):
              area_count = 1 if areas.strip() else 0

          else:
              try:
                  area_count = len(areas)
              except TypeError:
                  area_count = 0

          if area_count != 10:
              raise SystemExit(
                  f"ERROR: Expected 10 assessment areas, "
                  f"got {area_count}"
              )

          # ---------------------------------------------------------
          # LEARNING OBJECTIVES
          # ---------------------------------------------------------

          objectives = data.get("learning_objectives")

          if objectives is None:
              raise SystemExit(
                  "ERROR: learning_objectives are missing."
              )

          if isinstance(objectives, (list, dict)):
              objective_count = len(objectives)

          elif isinstance(objectives, str):
              objective_count = 1 if objectives.strip() else 0

          else:
              try:
                  objective_count = len(objectives)
              except TypeError:
                  objective_count = 0

          if objective_count == 0:
              raise SystemExit(
                  "ERROR: learning_objectives are empty."
              )

          # ---------------------------------------------------------
          # AI POLICY
          # ---------------------------------------------------------

          policy = data.get("ai_policy")

          if not isinstance(policy, dict):
              raise SystemExit(
                  "ERROR: ai_policy must be a JSON object."
              )

          # ---------------------------------------------------------
          # SUCCESS
          # ---------------------------------------------------------

          print("")
          print("========================================")
          print("STEP 33A VALIDATION")
          print("========================================")
          print("Step:", data.get("step"))
          print("Substep:", data.get("substep"))
          print("Stage:", data.get("stage"))
          print("Status:", data.get("status"))
          print("Questions:", question_count)
          print("Passing score:", str(passing_score) + "%")
          print("Assessment areas:", area_count)
          print("Learning objectives:", objective_count)
          print("AI policy: verified")
          print("========================================")
          print("STEP 33A VALIDATION: GREEN")
          print("========================================")
          PY

      - name: Display final STEP 33A summary
        run: |
          python - <<'PY'
          import json

          with open("assessment_workflow.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          config = data["assessment_configuration"]
          areas = config.get("areas")

          if isinstance(areas, (list, dict)):
              area_count = len(areas)
          elif isinstance(areas, str):
              area_count = 1 if areas.strip() else 0
          else:
              try:
                  area_count = len(areas)
              except TypeError:
                  area_count = 0

          print("")
          print("========================================")
          print("MARINEWISE STEP 33A")
          print("========================================")
          print("STATUS:", data["status"])
          print("QUESTIONS:", config["question_count"])
          print(
              "PASSING SCORE:",
              str(config["passing_score_percent"]) + "%"
          )
          print("ASSESSMENT AREAS:", area_count)
          print("========================================")
          print("STEP 33A FINAL STATUS: GREEN")
          print("========================================")

      - name: Commit STEP 33A output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assessment_workflow.json

          if git diff --cached --quiet; then
            echo "No assessment workflow changes to commit."
          else
            git commit -m "Add MarineWise STEP 33A assessment workflow"
            git push
          fi

      - name: Upload STEP 33A artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarineWise-Assessment-Workflow-STEP33A
          path: |
            assessment_workflow.json
            training_workflow.json
          if-no-files-found: error
