name: MarineWise STEP 33A Assessment Workflow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assessment-workflow:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify required files
        shell: bash
        run: |
          set -e

          test -f training_workflow.py
          test -f assessment_workflow.py
          test -f manual_catalog.json

          echo "Required files verified."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq gdown

      - name: Verify training workflow CLI
        run: |
          python training_workflow.py --help

      - name: Verify assessment workflow CLI
        run: |
          python assessment_workflow.py --help

      - name: Build STEP 30 training workflow
        run: |
          python training_workflow.py \
            --manufacturer "MAN" \
            --engine-model "16V175D-MM" \
            --topic "Fuel System and Injector Maintenance" \
            --technician-level "Basic" \
            --duration "4 Days" \
            --vessel "QL-40" \
            --manuals "manual_catalog.json" \
            --output training_workflow.json

      - name: Validate STEP 30 output
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("training_workflow.json")

          if not path.exists():
              raise SystemExit("ERROR: training_workflow.json not found.")

          if path.stat().st_size == 0:
              raise SystemExit("ERROR: training_workflow.json is empty.")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: training_workflow.json must be a JSON object."
              )

          if data.get("step") != 30:
              raise SystemExit(
                  f"ERROR: Expected STEP 30, got {data.get('step')}"
              )

          if data.get("status") != "READY_FOR_GROQ":
              raise SystemExit(
                  f"ERROR: Expected READY_FOR_GROQ, got {data.get('status')}"
              )

          if data.get("stage") != "training_intelligence_curriculum_planner":
              raise SystemExit(
                  "ERROR: Unexpected STEP 30 stage: "
                  + str(data.get("stage"))
              )

          print("STEP 30 VALIDATION: GREEN")
          print("Stage:", data.get("stage"))
          print("Status:", data.get("status"))
          PY

      - name: Run STEP 33A assessment workflow
        run: |
          python assessment_workflow.py \
            --training training_workflow.json \
            --output assessment_workflow.json \
            --question-count 20 \
            --passing-score 70

      - name: Validate STEP 33A output
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("assessment_workflow.json")

          # --------------------------------------------------
          # FILE CHECK
          # --------------------------------------------------

          if not path.exists():
              raise SystemExit(
                  "ERROR: assessment_workflow.json was not created."
              )

          if path.stat().st_size == 0:
              raise SystemExit(
                  "ERROR: assessment_workflow.json is empty."
              )

          # --------------------------------------------------
          # JSON CHECK
          # --------------------------------------------------

          try:
              with path.open("r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as exc:
              raise SystemExit(
                  f"ERROR: assessment_workflow.json is invalid JSON: {exc}"
              )

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: assessment_workflow.json must contain a JSON object."
              )

          # --------------------------------------------------
          # CORE STEP CHECKS
          # --------------------------------------------------

          if data.get("step") != 33:
              raise SystemExit(
                  f"ERROR: Expected step 33, got {data.get('step')}"
              )

          if data.get("substep") != "33A":
              raise SystemExit(
                  f"ERROR: Expected substep 33A, got {data.get('substep')}"
              )

          if data.get("stage") != "assessment_workflow":
              raise SystemExit(
                  f"ERROR: Expected stage assessment_workflow, "
                  f"got {data.get('stage')}"
              )

          if data.get("status") != "READY_FOR_GROQ":
              raise SystemExit(
                  f"ERROR: Expected status READY_FOR_GROQ, "
                  f"got {data.get('status')}"
              )

          # --------------------------------------------------
          # BASIC CONFIGURATION CHECK
          #
          # We only verify that assessment_configuration exists.
          # We DO NOT assume where optional fields are stored.
          # --------------------------------------------------

          configuration = data.get("assessment_configuration")

          if configuration is None:
              print(
                  "WARNING: assessment_configuration not found."
              )
          else:
              print(
                  "assessment_configuration found:",
                  type(configuration).__name__
              )

          # --------------------------------------------------
          # OPTIONAL INFORMATION
          #
          # These are informational only.
          # They MUST NOT fail the workflow.
          # --------------------------------------------------

          print("")
          print("========== STEP 33A OUTPUT ==========")
          print("Step:", data.get("step"))
          print("Substep:", data.get("substep"))
          print("Stage:", data.get("stage"))
          print("Status:", data.get("status"))

          if isinstance(configuration, dict):

              if "question_count" in configuration:
                  print(
                      "Question count:",
                      configuration["question_count"]
                  )

              if "passing_score_percent" in configuration:
                  print(
                      "Passing score:",
                      str(configuration["passing_score_percent"]) + "%"
                  )

              if "areas" in configuration:
                  print(
                      "Areas field found:",
                      type(configuration["areas"]).__name__
                  )
              else:
                  print(
                      "Areas field: not present at "
                      "assessment_configuration level"
                  )

              if "types" in configuration:
                  print(
                      "Types field found:",
                      type(configuration["types"]).__name__
                  )
              else:
                  print(
                      "Types field: not present at "
                      "assessment_configuration level"
                  )

          print("====================================")
          print("STEP 33A VALIDATION: GREEN")
          print("====================================")
          PY

      - name: Display final STEP 33A status
        run: |
          python - <<'PY'
          import json

          with open("assessment_workflow.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("")
          print("========================================")
          print("MARINEWISE STEP 33A")
          print("========================================")
          print("STEP:", data.get("step"))
          print("SUBSTEP:", data.get("substep"))
          print("STAGE:", data.get("stage"))
          print("STATUS:", data.get("status"))
          print("========================================")
          print("STEP 33A FINAL STATUS: GREEN")
          print("========================================")
          PY

      - name: Commit STEP 33A output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assessment_workflow.json

          if git diff --cached --quiet; then
            echo "No assessment workflow changes to commit."
          else
            git commit -m "Add MarineWise STEP 33A assessment workflow"
            git push
          fi

      - name: Upload STEP 33A artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarineWise-Assessment-Workflow-STEP33A
          path: |
            assessment_workflow.json
            training_workflow.json
          if-no-files-found: error
