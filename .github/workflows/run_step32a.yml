name: STEP 32A - Visual Training Document Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-training-package:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "gdown>=6.1.0" \
            "groq" \
            "python-docx" \
            "reportlab" \
            "python-pptx" \
            "pymupdf"

      - name: Verify required files
        run: |
          test -f manual_catalog.json
          test -f manual_selector.py
          test -f manual_downloader.py
          test -f training_workflow.py
          test -f training_answer.py
          test -f training_document_generator.py

          echo "All required files found."
          echo "Required files validation GREEN"

      - name: Verify Groq package
        run: |
          python - <<'PY'
          import groq

          print("Groq Python package imported successfully.")
          print("Groq dependency GREEN")
          PY

      - name: Verify GROQ_API_KEY
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "ERROR: GROQ_API_KEY secret is missing."
            exit 1
          fi

          echo "GROQ_API_KEY is available."
          echo "Groq secret validation GREEN"

      - name: Rebuild Step 30 training workflow
        run: |
          python training_workflow.py \
            --manufacturer "MAN" \
            --engine-model "16V175D-MM" \
            --topic "Fuel System and Injector Maintenance" \
            --technician-level "Basic" \
            --duration "4 Days" \
            --vessel "QL-40" \
            --manuals "manual_catalog.json" \
            --output training_workflow.json

      - name: Validate Step 30
        run: |
          python - <<'PY'
          import json

          with open("training_workflow.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Training workflow keys:")
          print(list(data.keys()))

          assert data.get("status") == "READY_FOR_GROQ", data.get("status")

          inputs = data.get("input", {})

          assert isinstance(inputs, dict), \
              "Training input section missing."

          required = [
              "manufacturer",
              "engine_model",
              "topic",
              "technician_level",
              "duration",
              "vessel",
          ]

          for field in required:
              assert field in inputs, \
                  f"Missing input field: {field}"

          print("STEP 30 status: READY_FOR_GROQ")
          print("STEP 30 input validation: GREEN")
          print("STEP 30 validation GREEN")
          PY

      - name: Generate Step 31 training content
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python training_answer.py \
            --workflow training_workflow.json \
            --output training_answer.json

      - name: Validate Step 31
        run: |
          python - <<'PY'
          import json

          with open("training_answer.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Training answer keys:")
          print(list(data.keys()))

          assert data.get("step") == "31", \
              f"Unexpected step: {data.get('step')}"

          assert data.get("stage") == "groq_training_content_generator", \
              f"Unexpected stage: {data.get('stage')}"

          assert data.get("status") == "SUCCESS", \
              f"Unexpected status: {data.get('status')}"

          policy = data.get("policy")

          assert policy, \
              "Training policy missing."

          print("STEP 31 status: SUCCESS")
          print("STEP 31 policy validation: GREEN")
          print("STEP 31 validation GREEN")
          PY

      - name: Select relevant OEM manuals
        run: |
          python manual_selector.py \
            --query "QL-40 MAN 16V175D-MM Main Engine Fuel System Injector Maintenance" \
            --top-k 10 \
            --output selected_manuals.json

      - name: Validate manual selection
        run: |
          python - <<'PY'
          import json

          with open("selected_manuals.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, list):
              records = data
          else:
              records = data.get(
                  "selected_manuals",
                  data.get("results", [])
              )

          assert len(records) > 0, \
              "No manuals selected."

          print(f"Selected manuals: {len(records)}")
          print("Manual selection GREEN")
          PY

      - name: Download selected OEM manuals
        run: |
          rm -rf selected_manuals

          python manual_downloader.py \
            --catalog manual_catalog.json \
            --selected selected_manuals.json \
            --output selected_manuals

      - name: Validate downloaded OEM manuals
        run: |
          count=$(find selected_manuals -type f -iname "*.pdf" | wc -l)

          echo "Downloaded PDF count: $count"

          if [ "$count" -lt 1 ]; then
            echo "ERROR: No OEM PDF files downloaded."
            exit 1
          fi

          echo "OEM manual download GREEN"

      - name: Build visual training package
        run: |
          rm -rf training_package

          python training_document_generator.py \
            --answer training_answer.json \
            --workflow training_workflow.json \
            --manual-dir selected_manuals \
            --output-dir training_package

      - name: Validate Step 32A outputs
        run: |
          test -f training_package/MarineWise_Training_Manual.docx
          test -f training_package/MarineWise_Training_Manual.pdf
          test -f training_package/MarineWise_Training_Presentation.pptx
          test -f training_package/training_package_manifest.json

          echo "All STEP 32A output files exist."

          echo ""
          echo "Training package contents:"
          find training_package -maxdepth 2 -type f | sort

          echo ""
          echo "OEM visual files:"
          find training_package/oem_images \
            -type f 2>/dev/null || true

          echo ""
          echo "STEP 32A SUCCESS - GREEN"

      - name: Upload STEP 32A training package
        uses: actions/upload-artifact@v4
        with:
          name: MarineWise-Training-Package-STEP32A
          path: training_package/
          if-no-files-found: error
