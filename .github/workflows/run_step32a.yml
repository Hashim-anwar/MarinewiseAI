name: STEP 32A - Visual Training Document Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-training-package:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "gdown>=6.1.0" \
            "groq" \
            "python-docx" \
            "reportlab" \
            "python-pptx" \
            "pymupdf"

      - name: Verify Python dependencies
        run: |
          python - <<'PY'
          import fitz
          import groq
          import docx
          import pptx
          import reportlab

          print("PyMuPDF: OK")
          print("Groq: OK")
          print("python-docx: OK")
          print("python-pptx: OK")
          print("ReportLab: OK")
          print("All dependencies GREEN")
          PY

      - name: Verify required project files
        run: |
          test -f manual_catalog.json
          test -f manual_selector.py
          test -f manual_downloader.py
          test -f training_workflow.py
          test -f training_answer.py
          test -f training_document_generator.py

          echo "All required project files found."
          echo "Project files GREEN"

      - name: Verify GROQ_API_KEY
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "ERROR: GROQ_API_KEY secret is missing."
            exit 1
          fi

          echo "GROQ_API_KEY available."
          echo "Groq secret GREEN"

      - name: Build Step 30 training workflow
        run: |
          python training_workflow.py \
            --manufacturer "MAN" \
            --engine-model "16V175D-MM" \
            --topic "Fuel System and Injector Maintenance" \
            --technician-level "Basic" \
            --duration "4 Days" \
            --vessel "QL-40" \
            --manuals "manual_catalog.json" \
            --output training_workflow.json

      - name: Verify Step 30
        run: |
          python - <<'PY'
          import json

          with open("training_workflow.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Step 30 status:", data.get("status"))

          if data.get("status") != "READY_FOR_GROQ":
              raise SystemExit(
                  f"Step 30 is not READY_FOR_GROQ: {data.get('status')}"
              )

          print("STEP 30 GREEN")
          PY

      - name: Build Step 31 training content
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python training_answer.py \
            --workflow training_workflow.json \
            --output training_answer.json

      - name: Verify Step 31
        run: |
          python - <<'PY'
          import json

          with open("training_answer.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Step 31 output keys:")
          for key in data.keys():
              print(" -", key)

          print("Step:", data.get("step"))
          print("Stage:", data.get("stage"))
          print("Status:", data.get("status"))

          if data.get("step") != 31:
              raise SystemExit(
                  f"Unexpected Step 31 number: {data.get('step')}"
              )

          if data.get("stage") != "groq_training_content_generator":
              raise SystemExit(
                  f"Unexpected Step 31 stage: {data.get('stage')}"
              )

          if data.get("status") != "SUCCESS":
              raise SystemExit(
                  f"Step 31 did not complete successfully: "
                  f"{data.get('status')}"
              )

          if not data.get("training_content"):
              raise SystemExit(
                  "Step 31 training_content is empty."
              )

          print("STEP 31 GREEN")
          PY

      - name: Select OEM manuals
        run: |
          python manual_selector.py \
            --query "QL-40 MAN 16V175D-MM Main Engine Fuel System Injector Maintenance" \
            --top-k 10 \
            --output selected_manuals.json

      - name: Verify OEM manual selection
        run: |
          python - <<'PY'
          import json

          with open("selected_manuals.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, list):
              records = data
          elif isinstance(data, dict):
              records = data.get("selected_manuals")

              if records is None:
                  records = data.get("results")

              if records is None:
                  records = data.get("manuals")

              if records is None:
                  records = []

          else:
              records = []

          if not records:
              raise SystemExit("No OEM manuals selected.")

          print("Selected OEM manuals:", len(records))
          print("OEM selection GREEN")
          PY

      - name: Download selected OEM manuals
        run: |
          rm -rf selected_manuals

          python manual_downloader.py \
            --catalog manual_catalog.json \
            --selected selected_manuals.json \
            --output selected_manuals

      - name: Verify downloaded OEM manuals
        run: |
          pdf_count=$(find selected_manuals -type f -iname "*.pdf" | wc -l)

          echo "Downloaded PDF count: $pdf_count"

          if [ "$pdf_count" -eq 0 ]; then
            echo "ERROR: No OEM PDFs were downloaded."
            exit 1
          fi

          echo "OEM PDF download GREEN"

      - name: Generate STEP 32A training package
        run: |
          rm -rf training_package

          python training_document_generator.py \
            --answer training_answer.json \
            --workflow training_workflow.json \
            --manual-dir selected_manuals \
            --output-dir training_package

      - name: Verify STEP 32A package
        run: |
          echo "Checking generated training package..."

          test -f training_package/MarineWise_Training_Manual.docx
          test -f training_package/MarineWise_Training_Manual.pdf
          test -f training_package/MarineWise_Training_Presentation.pptx
          test -f training_package/training_package_manifest.json

          echo ""
          echo "Generated files:"
          find training_package -type f | sort

          echo ""
          echo "STEP 32A SUCCESS - GREEN"

      - name: Upload STEP 32A package
        uses: actions/upload-artifact@v4
        with:
          name: MarineWise-Training-Package-STEP32A
          path: training_package
          if-no-files-found: error
