name: MarineWise STEP 19 Verification

on:
  workflow_dispatch:

jobs:
  test-step19:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify catalog exists
        run: |
          echo "Checking manual_catalog.json..."
          test -f manual_catalog.json
          echo "GREEN - manual_catalog.json found"

      - name: Run STEP 19 Smart Manual Selector
        run: |
          python manual_selector.py \
            --query "QL-40 MAN 16V175D-MM main engine high exhaust temperature alarm" \
            --top-k 10

      - name: STEP 19 verification complete
        run: |
          echo "=========================================="
          echo "STEP 19 VERIFICATION WORKFLOW COMPLETE"
          echo "=========================================="
      - name: Save STEP 19 selection
        run: |
          echo "=========================================="
          echo "SAVING STEP 19 SELECTION"
          echo "=========================================="

          test -f selected_manuals.json
          echo "GREEN - selected_manuals.json created"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add selected_manuals.json

          if git diff --cached --quiet; then
            echo "No selection changes to commit."
          else
            git commit -m "Update MarineWise selected manuals"
            git push
            echo "GREEN - selected_manuals.json committed"
          fi
