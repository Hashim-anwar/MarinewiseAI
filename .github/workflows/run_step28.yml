name: STEP 28 - Evidence and Citation Fusion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-fusion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            gdown \
            pypdf \
            rank_bm25 \
            sentence-transformers \
            faiss-cpu \
            requests

      - name: Verify Tavily secret
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          if [ -z "$TAVILY_API_KEY" ]; then
            echo "ERROR - TAVILY_API_KEY is not configured."
            exit 1
          fi

          echo "TAVILY_API_KEY is configured."

      - name: Verify required pipeline files
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "manual_catalog.json",
              "manual_selector.py",
              "manual_downloader.py",
              "document_extractor.py",
              "document_chunker.py",
              "vector_indexer.py",
              "hybrid_retriever.py",
              "evidence_reranker.py",
              "tavily_research.py",
              "evidence_fusion.py",
          ]

          missing = [
              item
              for item in required
              if not Path(item).exists()
          ]

          if missing:
              print("ERROR - Missing required pipeline files:")
              for item in missing:
                  print(f" - {item}")
              raise SystemExit(1)

          print("All required STEP 28 pipeline files are present.")
          PY

      - name: Select manuals
        run: |
          python manual_selector.py \
            "QL-40 MAN 16V175D-MM main engine high exhaust temperature alarm"

      - name: Download selected manuals
        run: |
          python manual_downloader.py

      - name: Extract selected manuals
        run: |
          python document_extractor.py

      - name: Create document chunks
        run: |
          python document_chunker.py

      - name: Build FAISS vector index
        run: |
          python vector_indexer.py

      - name: Run hybrid retrieval
        run: |
          python hybrid_retriever.py

      - name: Re-rank OEM evidence
        run: |
          python evidence_reranker.py

      - name: Verify OEM evidence output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("reranked_evidence.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR - reranked_evidence.json was not created."
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR - Invalid reranked evidence structure."
              )

          print("OEM evidence output verified.")
          print(f"File: {path}")
          PY

      - name: Run controlled Tavily research
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python tavily_research.py

      - name: Verify Tavily output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("tavily_results.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR - tavily_results.json was not created."
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          if data.get("step") != 27:
              raise SystemExit(
                  "ERROR - Invalid Tavily step number."
              )

          if data.get("provider") != "Tavily":
              raise SystemExit(
                  "ERROR - Invalid Tavily provider."
              )

          evidence = data.get("web_evidence")

          if not isinstance(evidence, list):
              raise SystemExit(
                  "ERROR - web_evidence is not a list."
              )

          if len(evidence) == 0:
              raise SystemExit(
                  "ERROR - Tavily returned no usable evidence."
              )

          print("Tavily output verified.")
          print(f"Web evidence: {len(evidence)}")
          PY

      - name: Run evidence and citation fusion
        run: |
          python evidence_fusion.py

      - name: Verify final evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          output_file = Path("final_evidence.json")

          if not output_file.exists():
              raise SystemExit(
                  "ERROR - final_evidence.json was not created."
              )

          data = json.loads(
              output_file.read_text(
                  encoding="utf-8"
              )
          )

          required = [
              "step",
              "stage",
              "evidence_summary",
              "source_policy",
              "oem_evidence",
              "web_evidence",
              "combined_evidence",
          ]

          for key in required:
              if key not in data:
                  raise SystemExit(
                      f"ERROR - Missing key: {key}"
                  )

          if data["step"] != 28:
              raise SystemExit(
                  "ERROR - Incorrect STEP number."
              )

          policy = data["source_policy"]

          checks = {
              "OEM priority":
                  policy.get("oem_priority") is True,

              "WEB is not OEM":
                  policy.get("web_is_not_oem") is True,

              "OEM manual reference":
                  policy.get(
                      "oem_requires_manual_reference"
                  ) is True,

              "WEB URL required":
                  policy.get(
                      "web_requires_url"
                  ) is True,

              "Source separation":
                  policy.get(
                      "source_types_are_separated"
                  ) is True,
          }

          failed = [
              name
              for name, passed in checks.items()
              if not passed
          ]

          if failed:
              print("FAILED POLICY CHECKS:")
              for item in failed:
                  print(f" - {item}")
              raise SystemExit(1)

          oem = data["oem_evidence"]
          web = data["web_evidence"]
          combined = data["combined_evidence"]

          if not isinstance(oem, list):
              raise SystemExit(
                  "ERROR - OEM evidence is not a list."
              )

          if not isinstance(web, list):
              raise SystemExit(
                  "ERROR - WEB evidence is not a list."
              )

          if not isinstance(combined, list):
              raise SystemExit(
                  "ERROR - Combined evidence is not a list."
              )

          if len(combined) != len(oem) + len(web):
              raise SystemExit(
                  "ERROR - Combined evidence count mismatch."
              )

          for item in oem:
              if item.get("source_type") != "OEM":
                  raise SystemExit(
                      "ERROR - Invalid OEM source type."
                  )

              if not item.get("source_file"):
                  raise SystemExit(
                      "ERROR - OEM source file missing."
                  )

              if not item.get("text"):
                  raise SystemExit(
                      "ERROR - OEM evidence text missing."
                  )

              if not item.get("citation", "").startswith("[OEM"):
                  raise SystemExit(
                      "ERROR - Invalid OEM citation."
                  )

          for item in web:
              if item.get("source_type") != "WEB":
                  raise SystemExit(
                      "ERROR - Invalid WEB source type."
                  )

              if not item.get("url"):
                  raise SystemExit(
                      "ERROR - WEB URL missing."
                  )

              if not item.get("text"):
                  raise SystemExit(
                      "ERROR - WEB evidence text missing."
                  )

              if not item.get("citation", "").startswith("[WEB"):
                  raise SystemExit(
                      "ERROR - Invalid WEB citation."
                  )

          print("=" * 70)
          print("STEP 28 VERIFICATION COMPLETE")
          print("=" * 70)
          print(f"OEM evidence       : {len(oem)}")
          print(f"WEB evidence       : {len(web)}")
          print(f"Combined evidence  : {len(combined)}")
          print()
          print("OEM priority       : TRUE")
          print("WEB is not OEM     : TRUE")
          print("Source separation  : TRUE")
          print("OEM references     : TRUE")
          print("WEB URLs           : TRUE")
          print()
          print("STEP 28: SUCCESS")
          print("GREEN")
          PY

      - name: Upload STEP 28 artifact
        uses: actions/upload-artifact@v4
        with:
          name: step28-final-evidence
          path: final_evidence.json
