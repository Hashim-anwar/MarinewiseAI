name: Test MARINEWISE RAG Environment

on:
  workflow_dispatch:

jobs:
  test-rag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install RAG dependencies
        run: |
          pip install faiss-cpu
          pip install sentence-transformers
          pip install pypdf
          pip install python-docx
          pip install rank_bm25
          pip install gdown

      - name: Test FAISS
        run: |
          python -c "import faiss; print('FAISS: OK')"

      - name: Test Sentence Transformers
        run: |
          python -c "from sentence_transformers import SentenceTransformer; print('Sentence Transformers: OK')"

      - name: Test project imports
        run: |
          python -c "from rag.chunking import split_text; print('Chunking: OK')"
          python -c "from rag.ingestion import find_documents; print('Ingestion: OK')"
          python -c "from rag.bm25_search import tokenize; print('BM25: OK')"
          python -c "from rag.vector_search import load_embedding_model; print('Vector Search: OK')"
