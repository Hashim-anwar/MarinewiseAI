name: MarineWise STEP 32D - Controlled AI Visual Generation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-ai-visuals:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify required files
        run: |
          test -f training_ai_visual_generator.py
          test -f validated_visual_requests.json

          echo "Required STEP 32D files verified."

      - name: Validate STEP 32C input
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("validated_visual_requests.json")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          assert data.get("step") == 32, "Invalid step."
          assert data.get("substep") == "32C", "Invalid substep."
          assert data.get("stage") == "oem_visual_quality_validator", "Invalid stage."
          assert data.get("status") == "SUCCESS", "STEP 32C is not SUCCESS."

          policy = data.get("visual_policy", {})

          assert policy.get("oem_visual_first") is True
          assert policy.get("ai_visual_only_when_oem_visual_is_unavailable") is True
          assert policy.get("technical_specs_must_come_from_oem") is True
          assert policy.get("fake_oem_figures_blocked") is True

          assert (
              data.get("ai_visual_label")
              == "AI Training Illustration — Not an OEM Figure"
          )

          print("STEP 32C input validation: GREEN")
          print("AI fallback requests:", len(data.get("ai_visual_requests", [])))
          PY

      - name: Check AI image generation configuration
        env:
          MARINEWISE_IMAGE_API_URL: ${{ secrets.MARINEWISE_IMAGE_API_URL }}
          MARINEWISE_IMAGE_API_KEY: ${{ secrets.MARINEWISE_IMAGE_API_KEY }}
        run: |
          if [ -z "$MARINEWISE_IMAGE_API_URL" ]; then
            echo "MARINEWISE_IMAGE_API_URL secret is not configured."
            echo "STEP 32D will not perform external image generation."
            echo "This is expected if STEP 32C produced zero AI fallback requests."
          else
            echo "Image API URL configured."
          fi

          if [ -z "$MARINEWISE_IMAGE_API_KEY" ]; then
            echo "MARINEWISE_IMAGE_API_KEY secret is not configured."
            echo "Actual external AI image generation requires this secret."
          else
            echo "Image API key configured."
          fi

      - name: Run controlled AI visual generator
        env:
          MARINEWISE_IMAGE_API_URL: ${{ secrets.MARINEWISE_IMAGE_API_URL }}
          MARINEWISE_IMAGE_API_KEY: ${{ secrets.MARINEWISE_IMAGE_API_KEY }}
        run: |
          python training_ai_visual_generator.py \
            --input validated_visual_requests.json \
            --output ai_training_visual_manifest.json \
            --visual-dir ai_training_visuals

      - name: Validate STEP 32D output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("ai_training_visual_manifest.json")

          if not path.exists():
              raise SystemExit(
                  "ai_training_visual_manifest.json was not created."
              )

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          assert data.get("step") == 32, "Invalid step."
          assert data.get("substep") == "32D", "Invalid substep."
          assert data.get("stage") == "controlled_ai_visual_generator", \
              "Invalid STEP 32D stage."

          assert data.get("ai_visual_label") == \
              "AI Training Illustration — Not an OEM Figure", \
              "Incorrect AI visual label."

          policy = data.get("visual_policy", {})

          assert policy.get("oem_visual_first") is True
          assert policy.get("ai_visual_only_when_oem_visual_is_unavailable") is True
          assert policy.get("ai_visual_is_generic_training_illustration") is True
          assert policy.get("ai_visual_not_oem_figure") is True
          assert policy.get("technical_specs_must_come_from_oem") is True
          assert policy.get("fake_oem_figures_blocked") is True

          generated = data.get("generated", [])
          failed = data.get("failed", [])
          skipped = data.get("skipped", [])

          print("STEP 32D output validation: GREEN")
          print("Generated:", len(generated))
          print("Failed:", len(failed))
          print("Skipped:", len(skipped))

          if failed:
              print("Failed requests:")
              for item in failed:
                  print(item)

              raise SystemExit(
                  "STEP 32D contains failed AI visual requests."
              )

          print("All STEP 32D validations passed.")
          PY

      - name: Verify generated visual files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("ai_training_visual_manifest.json")

          with manifest_path.open("r", encoding="utf-8") as f:
              manifest = json.load(f)

          generated = manifest.get("generated", [])

          missing = []

          for item in generated:
              file_path = item.get("file")

              if not file_path:
                  missing.append("missing file field")
                  continue

              path = Path(file_path)

              if not path.exists():
                  missing.append(str(path))

              elif path.stat().st_size == 0:
                  missing.append(f"empty file: {path}")

          if missing:
              print("Missing or invalid generated files:")
              for item in missing:
                  print(item)

              raise SystemExit(
                  "Generated visual file validation failed."
              )

          print("Generated visual files validation: GREEN")
          print("Validated files:", len(generated))
          PY

      - name: Display STEP 32D summary
        run: |
          python - <<'PY'
          import json

          with open(
              "ai_training_visual_manifest.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("")
          print("==============================================")
          print("MARINEWISE STEP 32D")
          print("CONTROLLED AI VISUAL GENERATION")
          print("==============================================")
          print("Status:", data.get("status"))
          print("Generated:", len(data.get("generated", [])))
          print("Failed:", len(data.get("failed", [])))
          print("Skipped:", len(data.get("skipped", [])))
          print(
              "AI Label:",
              data.get("ai_visual_label")
          )
          print("==============================================")
          PY

      - name: Upload STEP 32D artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarineWise-AI-Visuals-STEP32D
          path: |
            ai_training_visual_manifest.json
            ai_training_visuals/
          if-no-files-found: warn

      - name: Commit STEP 32D manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ai_training_visual_manifest.json

          if git diff --cached --quiet; then
            echo "No STEP 32D manifest changes to commit."
          else
            git commit -m "Add MarineWise STEP 32D AI visual manifest"
            git push
          fi

      - name: Final STEP 32D GREEN verification
        run: |
          echo "=============================================="
          echo "STEP 32D STATUS: GREEN"
          echo "Controlled AI visual generation completed."
          echo "OEM visuals remain protected."
          echo "AI visuals are fallback-only."
          echo "=============================================="
