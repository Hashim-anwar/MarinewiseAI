name: MarineWise STEP 32D - Controlled AI Visual Generation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-ai-visuals:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify required files
        run: |
          test -f training_ai_visual_generator.py
          test -f validated_visual_requests.json

          echo "Required STEP 32D files verified."
          echo "training_ai_visual_generator.py: FOUND"
          echo "validated_visual_requests.json: FOUND"

      - name: Inspect STEP 32C input
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("validated_visual_requests.json")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          print("STEP 32C INPUT")
          print("==============================")
          print("step:", data.get("step"))
          print("substep:", data.get("substep"))
          print("stage:", data.get("stage"))
          print("status:", data.get("status"))
          print(
              "AI fallback sections:",
              data.get("ai_fallback_sections")
          )
          print(
              "AI visual requests:",
              len(data.get("ai_visual_requests", []))
          )
          print(
              "AI label:",
              data.get("ai_visual_label")
          )
          print("==============================")

          if data.get("step") != 32:
              raise SystemExit("Invalid step in 32C manifest.")

          if data.get("substep") != "32C":
              raise SystemExit("Invalid substep in 32C manifest.")

          if data.get("status") != "SUCCESS":
              raise SystemExit(
                  "STEP 32C manifest status is not SUCCESS."
              )

          print("STEP 32C input validation: GREEN")
          PY

      - name: Check AI image generation configuration
        env:
          MARINEWISE_IMAGE_API_URL: ${{ secrets.MARINEWISE_IMAGE_API_URL }}
          MARINEWISE_IMAGE_API_KEY: ${{ secrets.MARINEWISE_IMAGE_API_KEY }}
        run: |
          if [ -z "$MARINEWISE_IMAGE_API_URL" ]; then
            echo "MARINEWISE_IMAGE_API_URL is not configured."
            echo "No external AI image generation will be attempted unless fallback requests exist."
          else
            echo "Image API URL configured."
          fi

          if [ -z "$MARINEWISE_IMAGE_API_KEY" ]; then
            echo "MARINEWISE_IMAGE_API_KEY is not configured."
            echo "No API key is currently available."
          else
            echo "Image API key configured."
          fi

      - name: Run controlled AI visual generator
        env:
          MARINEWISE_IMAGE_API_URL: ${{ secrets.MARINEWISE_IMAGE_API_URL }}
          MARINEWISE_IMAGE_API_KEY: ${{ secrets.MARINEWISE_IMAGE_API_KEY }}
        run: |
          python training_ai_visual_generator.py \
            --validated validated_visual_requests.json \
            --output-dir ai_training_visuals \
            --manifest ai_training_visual_manifest.json

      - name: Validate STEP 32D output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("ai_training_visual_manifest.json")

          if not path.exists():
              raise SystemExit(
                  "ai_training_visual_manifest.json was not created."
              )

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          print("")
          print("STEP 32D OUTPUT")
          print("==============================")
          print("step:", data.get("step"))
          print("substep:", data.get("substep"))
          print("stage:", data.get("stage"))
          print("status:", data.get("status"))
          print(
              "generated:",
              len(data.get("generated", []))
          )
          print(
              "failed:",
              len(data.get("failed", []))
          )
          print(
              "skipped:",
              len(data.get("skipped", []))
          )
          print(
              "label:",
              data.get("ai_visual_label")
          )
          print("==============================")

          if data.get("step") != 32:
              raise SystemExit("Invalid STEP 32D step.")

          if data.get("substep") != "32D":
              raise SystemExit("Invalid STEP 32D substep.")

          if data.get("stage") != "controlled_ai_visual_generator":
              raise SystemExit(
                  "Invalid STEP 32D stage."
              )

          if data.get("ai_visual_label") != \
              "AI Training Illustration — Not an OEM Figure":
              raise SystemExit(
                  "Incorrect AI visual label."
              )

          failed = data.get("failed", [])

          if failed:
              print("")
              print("FAILED AI VISUAL REQUESTS:")
              print("==============================")

              for item in failed:
                  print(item)

              raise SystemExit(
                  "STEP 32D contains failed AI visual requests."
              )

          print("")
          print("STEP 32D output validation: GREEN")
          PY

      - name: Verify generated visual files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path(
              "ai_training_visual_manifest.json"
          )

          with manifest_path.open(
              "r",
              encoding="utf-8"
          ) as f:
              manifest = json.load(f)

          generated = manifest.get("generated", [])

          missing = []

          for item in generated:

              file_path = item.get("file")

              if not file_path:
                  missing.append(
                      "Generated item has no file path."
                  )
                  continue

              path = Path(file_path)

              if not path.exists():
                  missing.append(str(path))

              elif path.stat().st_size == 0:
                  missing.append(
                      f"Empty generated file: {path}"
                  )

          if missing:

              print("INVALID GENERATED FILES")
              print("==============================")

              for item in missing:
                  print(item)

              raise SystemExit(
                  "Generated visual file validation failed."
              )

          print(
              "Generated visual files validation: GREEN"
          )

          print(
              "Validated files:",
              len(generated)
          )
          PY

      - name: Display STEP 32D summary
        run: |
          python - <<'PY'
          import json

          with open(
              "ai_training_visual_manifest.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("")
          print("==============================================")
          print("MARINEWISE STEP 32D")
          print("CONTROLLED AI VISUAL GENERATION")
          print("==============================================")
          print("Status:", data.get("status"))
          print(
              "Generated:",
              len(data.get("generated", []))
          )
          print(
              "Failed:",
              len(data.get("failed", []))
          )
          print(
              "Skipped:",
              len(data.get("skipped", []))
          )
          print(
              "AI Label:",
              data.get("ai_visual_label")
          )
          print("==============================================")
          PY

      - name: Upload STEP 32D artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarineWise-AI-Visuals-STEP32D
          path: |
            ai_training_visual_manifest.json
            ai_training_visuals/
          if-no-files-found: warn

      - name: Commit STEP 32D manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ai_training_visual_manifest.json

          if git diff --cached --quiet; then
            echo "No STEP 32D manifest changes to commit."
          else
            git commit -m "Add MarineWise STEP 32D AI visual manifest"
            git push
          fi

      - name: Final STEP 32D GREEN verification
        run: |
          echo "=============================================="
          echo "STEP 32D STATUS: GREEN"
          echo "Controlled AI visual generation completed."
          echo "OEM visuals remain protected."
          echo "AI visuals are fallback-only."
          echo "=============================================="
