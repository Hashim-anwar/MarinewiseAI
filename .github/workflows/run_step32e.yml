name: STEP 32E - Final Visual Package Integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-final-visual-package:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "gdown>=6.1.0" \
            groq \
            pymupdf \
            python-docx \
            reportlab \
            python-pptx

      - name: Verify required files
        run: |
          test -f training_workflow.py
          test -f training_answer.py
          test -f training_visual_validator.py
          test -f training_final_visual_integrator.py
          test -f manual_selector.py
          test -f manual_downloader.py
          test -f manual_catalog.json
          test -f ai_visual_requests.json
          test -f validated_visual_requests.json
          test -f ai_training_visual_manifest.json

          echo "Required files verification: GREEN"

      - name: Verify GROQ API key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY secret is missing."
            exit 1
          fi

          echo "GROQ_API_KEY verification: GREEN"

      # ============================================================
      # STEP 30
      # ============================================================

      - name: Rebuild STEP 30 training workflow
        run: |
          python training_workflow.py \
            --manufacturer "MAN" \
            --engine-model "16V175D-MM" \
            --topic "Fuel System and Injector Maintenance" \
            --technician-level "Basic" \
            --duration "4 Days" \
            --vessel "QL-40" \
            --manuals "manual_catalog.json" \
            --output training_workflow.json

      - name: Validate STEP 30
        run: |
          python - <<'PY'
          import json

          with open("training_workflow.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if data.get("step") != 30:
              raise SystemExit("STEP 30 validation failed.")

          if data.get("status") != "READY_FOR_GROQ":
              raise SystemExit(
                  f"STEP 30 status is {data.get('status')}"
              )

          print("STEP 30 validation: GREEN")
          PY

      # ============================================================
      # STEP 31
      # ============================================================

      - name: Rebuild STEP 31 training answer
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python training_answer.py \
            --workflow training_workflow.json \
            --output training_answer.json

      - name: Validate STEP 31
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("training_answer.json")

          if not path.exists():
              raise SystemExit(
                  "training_answer.json was not created."
              )

          if path.stat().st_size == 0:
              raise SystemExit(
                  "training_answer.json is empty."
              )

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "training_answer.json must contain a JSON object."
              )

          if data.get("step") != 31:
              raise SystemExit(
                  f"Unexpected STEP 31 value: {data.get('step')}"
              )

          if data.get("stage") != "groq_training_content_generator":
              raise SystemExit(
                  f"Unexpected STEP 31 stage: {data.get('stage')}"
              )

          if data.get("status") != "SUCCESS":
              raise SystemExit(
                  f"STEP 31 status is {data.get('status')}"
              )

          print("STEP 31 output exists.")
          print("STEP 31 JSON structure: valid.")
          print("STEP 31 validation: GREEN")
          PY

      # ============================================================
      # STEP 32C
      # ============================================================

      - name: Validate STEP 32C manifest
        run: |
          python - <<'PY'
          import json

          with open(
              "validated_visual_requests.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if data.get("step") != 32:
              raise SystemExit(
                  "STEP 32C step validation failed."
              )

          if data.get("substep") != "32C":
              raise SystemExit(
                  "STEP 32C substep validation failed."
              )

          if data.get("status") != "SUCCESS":
              raise SystemExit(
                  f"STEP 32C status is {data.get('status')}"
              )

          print("STEP 32C manifest validation: GREEN")
          PY

      # ============================================================
      # STEP 32D
      # ============================================================

      - name: Validate STEP 32D manifest
        run: |
          python - <<'PY'
          import json

          with open(
              "ai_training_visual_manifest.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          expected_label = (
              "AI Training Illustration — Not an OEM Figure"
          )

          if data.get("ai_visual_label") != expected_label:
              raise SystemExit(
                  "STEP 32D AI visual label validation failed."
              )

          print("STEP 32D manifest validation: GREEN")
          PY

      # ============================================================
      # SELECT 10 OEM MANUALS
      # ============================================================

      - name: Select relevant OEM manuals
        run: |
          python manual_selector.py \
            --query "QL-40 MAN 16V175D-MM Main Engine Fuel System Injector Maintenance" \
            --top-k 10 \
            --output selected_manuals.json

      - name: Validate selected manuals
        run: |
          python - <<'PY'
          import json

          with open(
              "selected_manuals.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if isinstance(data, list):
              manuals = data

          elif isinstance(data, dict):
              manuals = None

              for key in (
                  "selected_manuals",
                  "results",
                  "manuals",
                  "selections"
              ):
                  value = data.get(key)

                  if isinstance(value, list):
                      manuals = value
                      break

              if manuals is None:
                  raise SystemExit(
                      "No manual list found in selected_manuals.json."
                  )

          else:
              raise SystemExit(
                  "Unsupported selected_manuals.json format."
              )

          if len(manuals) != 10:
              raise SystemExit(
                  f"Expected 10 selected manuals, got {len(manuals)}"
              )

          print(f"Selected manuals: {len(manuals)}")
          print("Selected manuals validation: GREEN")
          PY

      # ============================================================
      # DOWNLOAD OEM MANUALS
      # ============================================================

      - name: Download selected OEM manuals
        run: |
          python manual_downloader.py \
            --selection selected_manuals.json \
            --catalog manual_catalog.json \
            --output-dir selected_manuals

      - name: Verify downloaded OEM manuals
        run: |
          count=$(find selected_manuals -type f -iname "*.pdf" | wc -l)

          echo "Downloaded PDF count: $count"

          if [ "$count" -lt 1 ]; then
            echo "No OEM PDF files were downloaded."
            exit 1
          fi

          echo "OEM manual download verification: GREEN"

      # ============================================================
      # REBUILD OEM VISUAL FILES
      # ============================================================

      - name: Rebuild validated OEM visual files
        run: |
          python training_visual_validator.py \
            --planner ai_visual_requests.json \
            --manual-dir selected_manuals \
            --output validated_visual_requests_runtime.json \
            --visual-dir validated_oem_visuals

      - name: Validate rebuilt OEM visuals
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "validated_visual_requests_runtime.json"
          )

          if not path.exists():
              raise SystemExit(
                  "Runtime visual manifest was not created."
              )

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if data.get("step") != 32:
              raise SystemExit(
                  "Runtime visual step is incorrect."
              )

          if data.get("substep") != "32C":
              raise SystemExit(
                  "Runtime visual substep is incorrect."
              )

          if data.get("status") != "SUCCESS":
              raise SystemExit(
                  f"Runtime visual status is {data.get('status')}"
              )

          visual_dir = Path("validated_oem_visuals")

          if not visual_dir.exists():
              raise SystemExit(
                  "validated_oem_visuals directory does not exist."
              )

          images = list(visual_dir.glob("*.png"))

          print(
              f"Runtime OEM visual files found: {len(images)}"
          )

          print("Runtime OEM visual rebuild: GREEN")
          PY

      # ============================================================
      # STEP 32E
      # ============================================================

      - name: Run STEP 32E final visual integrator
        run: |
          python training_final_visual_integrator.py \
            --training training_answer.json \
            --validated validated_visual_requests_runtime.json \
            --ai-manifest ai_training_visual_manifest.json \
            --output-dir final_training_package \
            --manifest final_visual_package_manifest.json

      # ============================================================
      # FINAL VALIDATION
      # ============================================================

      - name: Validate STEP 32E output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path(
              "final_visual_package_manifest.json"
          )

          if not manifest_path.exists():
              raise SystemExit(
                  "STEP 32E manifest was not created."
              )

          with manifest_path.open(
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if data.get("step") != 32:
              raise SystemExit(
                  "STEP 32E step validation failed."
              )

          if data.get("substep") != "32E":
              raise SystemExit(
                  "STEP 32E substep validation failed."
              )

          if data.get("stage") != "final_visual_package_integrator":
              raise SystemExit(
                  f"Unexpected STEP 32E stage: "
                  f"{data.get('stage')}"
              )

          if data.get("status") != "SUCCESS":
              raise SystemExit(
                  f"STEP 32E status is {data.get('status')}"
              )

          if data.get("visual_sections") != 10:
              raise SystemExit(
                  f"Expected 10 visual sections, got "
                  f"{data.get('visual_sections')}"
              )

          expected_label = (
              "AI Training Illustration — Not an OEM Figure"
          )

          if data.get("ai_visual_label") != expected_label:
              raise SystemExit(
                  "STEP 32E AI visual label validation failed."
              )

          visuals = data.get("visuals", [])

          if not isinstance(visuals, list):
              raise SystemExit(
                  "STEP 32E visuals field is not a list."
              )

          if len(visuals) != 10:
              raise SystemExit(
                  f"Expected 10 visual records, got {len(visuals)}"
              )

          print("STEP 32E manifest validation: GREEN")
          print(
              "OEM visuals integrated:",
              data.get("oem_visuals_integrated")
          )
          print(
              "AI visuals integrated:",
              data.get("ai_visuals_integrated")
          )
          print(
              "Visuals unavailable:",
              data.get("visuals_unavailable")
          )
          PY

      # ============================================================
      # VERIFY PACKAGE
      # ============================================================

      - name: Verify final visual package
        run: |
          test -d final_training_package

          echo "Final training package directory exists."

          find final_training_package -type f -print

          echo "Final visual package verification: GREEN"

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload STEP 32E artifact
        uses: actions/upload-artifact@v5
        with:
          name: MarineWise-Final-Visual-Integration-STEP32E
          path: |
            final_training_package/
            final_visual_package_manifest.json
            training_answer.json
            training_workflow.json
            validated_visual_requests_runtime.json
          if-no-files-found: error

      # ============================================================
      # COMMIT MANIFEST
      # ============================================================

      - name: Commit STEP 32E manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add final_visual_package_manifest.json

          if git diff --cached --quiet; then
            echo "No STEP 32E manifest changes."
          else
            git commit -m "Add MarineWise STEP 32E final visual package manifest"
            git push
          fi

      # ============================================================
      # FINAL GREEN
      # ============================================================

      - name: STEP 32E final GREEN verification
        run: |
          echo "=============================================="
          echo "MARINEWISE STEP 32E"
          echo "FINAL VISUAL PACKAGE INTEGRATION"
          echo "STATUS: GREEN"
          echo "=============================================="
